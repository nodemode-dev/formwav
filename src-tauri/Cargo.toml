[package]
name = "formwav-desktop"
version = "1.37.0"
description = "formwav desktop app: a thin Tauri shell over the formwav engine sidecar"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
regex = "1"

[profile.release]
strip = true
lto = true
