[package]
name = "formwav-desktop"
version = "1.92.0"
description = "formwav desktop app: a thin Tauri shell over the formwav engine sidecar"
authors = ["nodemode-ai"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
regex = "1"

[profile.release]
strip = true
lto = true

# Build scripts and proc macros run on the build machine and never ship: left unstripped. On macOS 27 with Xcode 27,
# stripping one leaves its LINKEDIT string pool misaligned, dyld refuses to load it, and rustc reports the macro's crate
# as missing (the owner's build: "can't find crate for `phf_macros`"). The app's own binary is stripped as before.
[profile.release.build-override]
strip = false
