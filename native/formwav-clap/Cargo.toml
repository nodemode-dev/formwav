[package]
name = "formwav-clap"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "RX-67: formwav's realtime repair tools (De-noise, De-hum) as CLAP plugins for other hosts"

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.5"
formwav-dsp = { path = "../formwav-dsp" }

[profile.release]
panic = "abort"
