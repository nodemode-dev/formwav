[package]
name = "formwav-dsp"
version = "2.22.1"
edition = "2021"
license = "Apache-2.0"
description = "formwav audio core: the mixer and renderer, realtime effects, loudness, onsets and peaks, synthesis, native audio output and MIDI input; built native, as a Python module and to wasm32"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
# Native audio output (cpal) for the engine and the desktop app; never in the wasm build.
native = ["dep:cpal", "dep:serde", "dep:serde_json", "dep:midir", "dep:clap-sys", "dep:libloading"]
# AU-23, opt-in: ASIO devices on Windows through cpal's ASIO host. Building with it needs Steinberg's ASIO SDK
# (CPAL_ASIO_DIR pointing at it) and links it under its own licence (GPLv3 or Steinberg's); the default build leaves it
# out and stays Apache-2.0.
asio = ["native", "cpal/asio"]

[dependencies]
# RX-16: the live dialogue isolate, RNNoise's network and weights in pure Rust (so it builds for the browser's audio
# worklet too); BSD-3-Clause; its optional features (file I/O, a resampler, a command-line tool) left out
nnnoiseless = { version = "0.5.2", default-features = false }
# formwav's studio processors (native/formwav-studio)
formwav-studio = { path = "../formwav-studio" }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"], optional = true }
cpal = { version = "0.18", optional = true }
# AU-37: MIDI devices read by the engine itself (the macOS app's WebKit has no Web MIDI); MIT licence
midir = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# S17: CLAP plug-ins hosted live as track inserts in the engine's own process (crate::plugin); MIT and ISC licences
clap-sys = { version = "0.5", optional = true }
libloading = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }

# Not stripped: on macOS 27 with Xcode 27, strip (which Cargo's default release profile runs, strip = "debuginfo") can
# leave a library's LINKEDIT string pool misaligned, and dyld then refuses to load it; the owner's engine could not
# import this core ("mis-aligned LINKEDIT string pool"). The WebAssembly build keeps its stripping (frontend/oc_install
# sets CARGO_PROFILE_RELEASE_STRIP=debuginfo for it: 156 kB rather than 1.8 MB).
[profile.release]
strip = false
