[package]
name = "formwav-dsp"
version = "1.72.0"
edition = "2021"
license = "Apache-2.0"
description = "formwav audio core: graph, DSP and plugin hosting, built native, as a Python module and to wasm32"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]
# Native audio output (cpal) for the engine and the desktop app; never in the wasm build.
native = ["dep:cpal", "dep:serde", "dep:serde_json"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"], optional = true }
cpal = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
