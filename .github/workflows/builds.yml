name: builds

# The desktop app built on each platform by its own script, as a person building it would, and kept as the run's
# artifacts: a .dmg (macOS on Apple silicon), a .deb (Linux x86_64) and an NSIS installer (Windows x64). It runs on
# every release commit pushed to main (chore(release): ...) and on request. Unsigned, as the scripts make them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the native helpers link libsndfile and portaudio (Nyquist, Vamp) and lilv (LV2), found by pkg-config
      - name: the helpers' libraries
        run: brew install pkgconf libsndfile portaudio lilv
      - run: ./build_macos_app
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the oldest Ubuntu runner, so the .deb's glibc floor is as low as the runners allow
      - name: the shell's and the helpers' libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsndfile1-dev portaudio19-dev liblilv-dev libasound2-dev
      - run: ./build_linux_app
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-linux
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  windows:
    name: Windows app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the C helpers build in MSYS2's UCRT64 shell (preinstalled on the runner at C:\msys64), linked statically
      - name: the helpers' libraries in MSYS2
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libsndfile mingw-w64-ucrt-x86_64-portaudio mingw-w64-ucrt-x86_64-lilv"
      - name: build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build_windows_app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
