name: builds

# The desktop app built on each platform by its own script, as a person building it would, and kept as the run's
# artifacts: a .dmg (macOS on Apple silicon), a .deb, an .rpm, an AppImage and a .tar.gz (Linux x86_64 and arm64) and
# an NSIS installer (Windows x64). It runs on every release commit pushed to main (chore(release): ...) and on request.
# S18: signed when the repository holds the signing secrets (macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, and for notarizing APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID; Windows: WINDOWS_SIGN_COMMAND),
# unsigned without them; on a release commit a draft GitHub release for the version gathers every package with a
# SHA256SUMS file, for the owner to read over and publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the native helpers link libsndfile and portaudio (Nyquist, Vamp) and lilv (LV2), found by pkg-config
      - name: the helpers' libraries
        run: brew install pkgconf libsndfile portaudio lilv
      # S18: the Tauri build signs and notarizes from these when they are set (an empty one leaves the app unsigned)
      - run: ./build_macos_app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    name: Linux app (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          # S18: GitHub's arm64 runner, the same script building for aarch64
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the oldest Ubuntu runner, so the .deb's glibc floor is as low as the runners allow
      - name: the shell's and the helpers' libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsndfile1-dev portaudio19-dev liblilv-dev libasound2-dev file
      # S18: a .deb, an .rpm, an AppImage and a .tar.gz of what the .deb installs
      - run: ./build_linux_app
        env:
          BUNDLES: deb,rpm,appimage
          TARBALL: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/tar/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows app
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the C helpers build in MSYS2's UCRT64 shell (preinstalled on the runner at C:\msys64), linked statically
      - name: the helpers' libraries in MSYS2
        shell: pwsh
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-libsndfile mingw-w64-ucrt-x86_64-portaudio mingw-w64-ucrt-x86_64-lilv"
      - name: build
        shell: pwsh
        # S18: signs through this command (with %1 for the file) when the secret is set
        env:
          FORMWAV_WINDOWS_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: powershell -ExecutionPolicy Bypass -File .\build_windows_app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: formwav-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # S18: every package of a release commit in one draft release, with its checksums; the owner reads it over and
  # publishes it. A draft for the same version already there gets the new files in place of the old.
  release:
    name: Release draft
    needs: [macos, linux, windows]
    if: startsWith(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: checksums
        working-directory: packages
        # the Linux artifacts keep their bundle folders (deb/, rpm/, ...): every file comes up to one level first
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          ls -1
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          notes="formwav $version: the desktop app for macOS (Apple silicon), Linux (x86_64 and arm64: .deb, .rpm, AppImage, .tar.gz) and Windows (x64). What changed is in the README's Status. Check a download against SHA256SUMS: sha256sum -c SHA256SUMS --ignore-missing"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --draft --target "$GITHUB_SHA" --title "formwav $version" --notes "$notes"
          fi
